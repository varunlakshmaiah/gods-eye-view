[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-gateway"
version = "1.0.0"
description = "Gods-Eye-View Headless AI Agent & MCP Spatial Gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "mcp>=1.0.0",
    "sgp4>=2.23",
    "h3>=3.7.6",
    "asyncpg>=0.29.0",
    "redis>=5.1.0",
    "httpx>=0.27.2",
    "pydantic>=2.9.2",
    "websockets>=13.1",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
